name: Daily lunch menu email

"on":
  schedule:
    # Cron always runs in UTC, and Europe/Prague alternates between UTC+2
    # (CEST, roughly late Mar - late Oct) and UTC+1 (CET, the rest of the
    # year), so a single fixed cron would drift by an hour twice a year.
    # Instead we schedule both UTC offsets that could correspond to 9:33
    # local time and pass the fired cron to main.py, which sends only on
    # the one matching the current offset; the other is a same-day no-op.
    # This keeps delivery pinned to 9:33 year-round without ever needing
    # to touch this file again.
    #
    # The target is early on purpose: GitHub only guarantees that a
    # scheduled workflow starts *at or after* its cron time, and delays of
    # 30-60 minutes happen regularly on shared runners (2026-08-21 fired 45
    # minutes late), so the send time is effectively a floor, not an exact
    # time. Minute is off the hour because :00 is the most congested slot
    # on all of GitHub Actions and gets delayed the hardest.
    - cron: "33 7 * * 1-5" # ~9:33 CEST
    - cron: "33 8 * * 1-5" # ~9:33 CET
  workflow_dispatch: {}

jobs:
  send-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send menu email
        run: python main.py
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
