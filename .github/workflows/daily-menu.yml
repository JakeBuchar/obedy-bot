name: Daily lunch menu email

"on":
  schedule:
    # The email goes out as soon as the runner starts, so this cron is the
    # earliest possible delivery time rather than an exact one: GitHub only
    # promises to start a scheduled run *at or after* its cron time and is
    # routinely 30-60 minutes late (2026-08-25 by 33 min, 2026-08-24 by 51
    # and 48 min).
    #
    # 6:47 UTC is 8:47 local in summer (CEST) and 7:47 in winter (CET), so
    # in practice the menu lands somewhere between then and roughly an hour
    # later - always well before lunch, which is what matters here.
    #
    # The later two are backups. GitHub does not merely delay scheduled runs,
    # it also drops them: on 2026-08-27 the 6:47 cron never fired at all and
    # no email went out. A run that finds the menu already sent exits in
    # seconds (see already_sent.py), so the backups cost nothing on the days
    # the first cron works.
    - cron: "47 6 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "20 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  # Lets already_sent.py ask whether an earlier run today already sent.
  actions: read

jobs:
  send-menu:
    runs-on: ubuntu-latest
    # Scraping every restaurant takes seconds; anything longer is a hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send menu email
        run: python main.py
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
