name: Daily lunch menu email (Praha)

"on":
  # No GitHub cron on purpose, the same as Kolín. GitHub's scheduler starts
  # these runs 3.5 to 12 hours late (on 2026-08-27 not at all), so as a
  # fallback it only ever delivered the menu after lunch - and on 2026-09-10
  # it sent a second copy at 13:50, because the morning delivery had exited
  # red over two unreachable restaurants and so did not count as "sent".
  #
  # Delivery comes from an external scheduler calling the workflow_dispatch
  # API, which starts within seconds. See README for the setup.
  workflow_dispatch:
    inputs:
      skip_if_sent:
        description: "Skip when today's email already went out (for the external scheduler; leave off to always send)"
        type: boolean
        default: false

permissions:
  contents: read
  # Lets already_sent.py ask whether an earlier run today already sent.
  actions: read

jobs:
  send-menu:
    runs-on: ubuntu-latest
    # Scraping every restaurant takes seconds, but a site that has gone quiet
    # is retried for a couple of minutes. Being cut off mid-run would mean no
    # email at all, which is worse than a slow one, so leave plenty of room.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send menu email
        run: python main.py
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_IF_SENT: ${{ inputs.skip_if_sent }}
          CONFIG_PATH: config/praha.yaml
          CITY: Praha
          WORKFLOW_FILE: daily-menu.yml
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
