name: Daily lunch menu email

"on":
  schedule:
    # This cron is only a wake-up call, not the send time: GitHub promises
    # merely to start a scheduled run *at or after* its cron time, and on
    # shared runners it is routinely 30-90 minutes late (2026-08-24 fired
    # 51 and 48 minutes late, 2026-08-21 45 minutes). Pinning delivery to
    # the cron time is therefore impossible.
    #
    # So the job starts with a deliberate head start and main.py sleeps
    # until 9:33 Europe/Prague before scraping and sending. The send time
    # then comes from a clock we control, and a late start only eats into
    # the head start instead of shifting the email.
    #
    # 6:00 UTC is 8:00 local in summer (CEST) and 7:00 in winter (CET), so
    # the head start is 93 min / 153 min - comfortably more than the worst
    # delay seen so far, and DST needs no second cron: whatever the offset,
    # main.py wakes up at the same local time.
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}

jobs:
  send-menu:
    runs-on: ubuntu-latest
    # Head start (up to ~2.5 h) plus scraping, still far below the 6 h cap.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send menu email
        run: python main.py
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
