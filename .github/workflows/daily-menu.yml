name: Daily lunch menu email

"on":
  schedule:
    # Cron always runs in UTC, and Europe/Prague alternates between UTC+2
    # (CEST, roughly late Mar - late Oct) and UTC+1 (CET, the rest of the
    # year), so a single fixed cron would drift by an hour twice a year.
    # Instead we schedule both UTC offsets that could correspond to 10:00
    # local time; main.py checks the *actual* local time at run time and
    # only sends on the one that's really 10:00 Europe/Prague, the other
    # is a same-day no-op. This keeps delivery pinned to 10:00 year-round
    # without ever needing to touch this file again.
    #
    # Minute is deliberately :13, not :00 - GitHub's own docs warn that
    # scheduled workflows "may be delayed during periods of high load...
    # the start of every hour", and on-the-hour crons are the single most
    # congested slot on all of GitHub Actions (sometimes delayed by 30+
    # minutes or dropped for that day entirely). Off-peak minutes like
    # :13 run reliably on time.
    - cron: "15 9 * * 1-5" # TEMP TEST after making repo public - revert to 13 8/9 after confirming
    - cron: "15 10 * * 1-5" # TEMP TEST after making repo public - revert to 13 8/9 after confirming
  workflow_dispatch: {}

jobs:
  send-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send menu email
        run: python main.py
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
